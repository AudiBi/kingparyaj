  #   name: kingparyaj-worker
  #   runtime: docker
  #   region: virginia
  #   plan: starter
  #   dockerfilePath: ./Docker/Dockerfile
  #   dockerContext: .
  #   dockerCommand: celery -A app.workers.celery worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
  #   autoDeploy: false
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: kingparyaj-db
